name: ci

# Offline. No secrets, no network, no Azure -- so it runs on forks and on pull requests from
# them, which is what makes the port contributable. Everything it checks is the logic that would
# otherwise only fail 20 minutes into a real run: the 22 statements parsing, the placeholders
# rendering, each engine's identifier style, the part-count plan, and the token scrubber.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/dev.txt
      - run: pip install -r requirements/dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
