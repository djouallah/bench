name: probe firebolt

# Can Firebolt Core read OneLake Iceberg at all? See .github/scripts/probe_firebolt.py for what each
# probe isolates. Green means the REST-catalog path works and a firebolt_iceberg engine is worth
# building; red with the per-probe summary says which layer (catalog or Azure storage) is missing.

on:
  workflow_dispatch:
    inputs:
      image:
        description: Firebolt Core image. `dev` is the rolling preview tag.
        type: string
        default: ghcr.io/firebolt-db/engine:dev

concurrency:
  group: onelake
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUNBUFFERED: "1"
      TPCH_SF: "10"
      FABRIC_WORKSPACE_ID: ${{ secrets.FABRIC_WORKSPACE_ID }}
      FABRIC_LAKEHOUSE_ID: ${{ secrets.FABRIC_LAKEHOUSE_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/catalog.txt
      # catalog.txt only for pyiceberg, which looks up nation's metadata.json and one data file.
      - run: pip install -r requirements/catalog.txt

      # Docker is Firebolt's supported way to run Core. io_uring needs kernel >= 6.1; the
      # ubuntu-24.04 runner has 6.8+. The flags are the ones the upstream README passes.
      - name: Start Firebolt Core
        run: |
          uname -r
          docker run -d --name firebolt \
            --ulimit memlock=8589934592:8589934592 \
            --security-opt seccomp=unconfined \
            -p 127.0.0.1:3473:3473 \
            "${{ inputs.image }}"
          docker image inspect --format '{{index .RepoDigests 0}}' "${{ inputs.image }}"

      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - run: python .github/scripts/probe_firebolt.py

      # The server may log query text, and every probe's text carries the bearer. The runner never
      # sees the token (Python mints it), so ::add-mask:: cannot cover it -- redact JWT shapes.
      - name: Firebolt server log
        if: always()
        run: |
          docker logs firebolt 2>&1 | tail -n 200 \
            | sed -E 's/eyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]*/***REDACTED***/g'
