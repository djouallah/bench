name: tpcds bench

# THE SECOND QUERY SUITE: the same job graph as bench.yml, on TPC-DS's 24 tables and 99
# statements, with the same seven engines and the same shared scripts (BENCH_SUITE=tpcds picks
# the suite, bench/suite.py).
#
#   prepare  ->  bench (matrix, one engine at a time)  ->  publish
#
# `prepare` is the SINGLE WRITER of the TPC-DS Iceberg tables, for the reason bench.yml gives.
# It differs from the TPC-H one in the tool: DuckDB's dsdgen generates SF=N into a local database
# on the runner, and DuckDB's own Iceberg writer then creates each table in OneLake with a CTAS
# through the write-capable ATTACH the ETL benchmark uses (bench/tpcds/generate.py says why, and
# why tpcgen was not the answer). No parquet is uploaded and nothing is re-encoded.
#
# `publish` is the SINGLE WRITER of results, under results/tpcds/ and docs/tpcds/ -- separate
# trees so the two query suites' histories never mix. It needs NO Azure credentials at all.

on:
  workflow_dispatch:
    inputs:
      sf:
        description: Scale factor. 1 is the smoke value; 10 is the default. 30 does not fit the runner disk through DuckDB.
        type: choice
        options: ["1", "10"]
        default: "10"
      engines:
        description: Comma-separated engines to run.
        type: string
        default: duckdb_iceberg,duckdb_nocache_iceberg,chdb_iceberg,polars_iceberg,lakesail_iceberg,pyspark_iceberg
      publish:
        description: Commit results and charts. Off leaves the artifacts and touches nothing.
        type: boolean
        default: true

# QUEUE, NEVER CANCEL, and ONE GROUP FOR EVERY BENCHMARK -- the same string as bench.yml and
# etl.yml. The workflows share one lakehouse and one OneLake pipe, and the engine under test must
# have that pipe to itself. A run of any of them, at any SF or file count, queues behind whatever
# is running. A cancelled `prepare` leaves a namespace half-written; the next run resumes it
# (bench/tpcds/generate.py skips tables that already have data files), but that is never what
# you want to be doing on purpose.
concurrency:
  group: onelake
  cancel-in-progress: false

env:
  # The scripts live in .github/scripts and import `bench` from the repo root, which Python does
  # NOT put on sys.path (it adds the SCRIPT's directory, not the working directory).
  PYTHONPATH: ${{ github.workspace }}
  PYTHONUNBUFFERED: "1"
  # Which query suite the shared scripts run (bench/suite.py). bench.yml says tpch.
  BENCH_SUITE: tpcds
  TPCDS_SF: ${{ inputs.sf || '10' }}
  FABRIC_WORKSPACE_ID: ${{ secrets.FABRIC_WORKSPACE_ID }}
  FABRIC_LAKEHOUSE_ID: ${{ secrets.FABRIC_LAKEHOUSE_ID }}
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    # dsdgen at SF=10 plus ~3 GB of CTAS out to OneLake. Generous; the cap is a hang guard.
    timeout-minutes: 90
    permissions:
      id-token: write
      contents: read
    env:
      # DuckDB WRITES here, through its azure extension, so the bench jobs' transport pair applies
      # to this job too: the default transport fails the OneLake TLS handshake on Linux, and the
      # symptom is an unreadable (here: unwritable) data file, not an auth error. See bench.yml.
      AZURE_TRANSPORT_OPTION_TYPE: curl
      CURL_CA_INFO: /etc/ssl/certs/ca-certificates.crt
    outputs:
      engines: ${{ steps.plan.outputs.engines }}
      started: ${{ steps.plan.outputs.started }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements/catalog.txt
            requirements/duckdb_iceberg.txt
      # catalog.txt for pyiceberg (the completion marker, the per-table layout read) and the
      # credential; duckdb_iceberg.txt for the DuckDB that generates and writes -- the ENGINE's
      # own file, so the writer is the same build the DuckDB bench job reads with. The same pair
      # auth_smoke.yml installs.
      - run: pip install -r requirements/catalog.txt -r requirements/duckdb_iceberg.txt

      - id: plan
        # The matrix needs a JSON array; the input is a human-friendly CSV. `started` is stamped
        # once here so every artifact in the run shares one timestamp.
        run: |
          ENGINES=$(printf '%s' "${{ inputs.engines || 'duckdb_iceberg,duckdb_nocache_iceberg,chdb_iceberg,polars_iceberg,lakesail_iceberg,pyspark_iceberg' }}" \
            | jq -Rc 'split(",") | map(sub("^\\s+";"") | sub("\\s+$";"")) | map(select(length > 0))')
          echo "engines=$ENGINES" >> "$GITHUB_OUTPUT"
          echo "started=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "engines: $ENGINES"

      # OIDC only. No client secret exists on this app registration.
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Generate TPC-DS into OneLake with DuckDB (idempotent)
        run: python .github/scripts/prepare.py

  bench:
    needs: prepare
    # Display only -- see bench.yml. The final `|| matrix.engine` covers a new engine.
    name: >-
      ${{ matrix.engine == 'duckdb_iceberg' && '🦆 DuckDB'
      || matrix.engine == 'duckdb_nocache_iceberg' && '🦆 DuckDB, cache off'
      || matrix.engine == 'chdb_iceberg' && '⚡ chDB'
      || matrix.engine == 'polars_iceberg' && '🐻‍❄️ Polars'
      || matrix.engine == 'lakesail_iceberg' && '⛵ LakeSail'
      || matrix.engine == 'daft_iceberg' && '💠 Daft'
      || matrix.engine == 'pyspark_iceberg' && '✨ Spark-OSS'
      || matrix.engine }}
    runs-on: ubuntu-latest
    # The Entra token is baked into DuckDB's ATTACH, chDB's CREATE DATABASE and Sail's env var,
    # and none of them ever asks for a new one. 50 minutes keeps the whole job inside the
    # lifetime of the token it was handed -- and 99 statements twice is a longer job than 22
    # twice, so an engine that cannot finish inside it reports what it did finish.
    timeout-minutes: 50
    permissions:
      id-token: write
      contents: read
    strategy:
      # MANDATORY. A LakeSail OOM must not delete DuckDB's results.
      fail-fast: false
      # ONE ENGINE AT A TIME. See bench.yml for the measurements behind this.
      max-parallel: 1
      matrix:
        engine: ${{ fromJSON(needs.prepare.outputs.engines) }}
    env:
      BENCH_ENGINE: ${{ matrix.engine }}
      # See bench.yml: DuckDB's azure extension needs the curl transport on Linux.
      AZURE_TRANSPORT_OPTION_TYPE: curl
      CURL_CA_INFO: /etc/ssl/certs/ca-certificates.crt
      # Local-mode Spark: the driver JVM IS the executor and its heap is fixed before Python
      # starts it, so .config("spark.driver.memory") is silently ignored and this must be env.
      SPARK_DRIVER_MEMORY: 11g
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/${{ matrix.engine }}.txt

      # One self-contained file per engine, the same files bench.yml installs: both query suites
      # measure one build of each engine.
      - name: Install ${{ matrix.engine }}
        run: |
          pip install -r "requirements/${BENCH_ENGINE}.txt"
          pip list --format=freeze | grep -Ei '^(duckdb|chdb|polars|pysail|pyiceberg|pyarrow)=' || true

      - uses: actions/setup-java@v5
        if: startsWith(matrix.engine, 'pyspark')
        with:
          distribution: temurin
          java-version: "17"

      # spark.jars.packages resolves iceberg-spark-runtime + hadoop-azure from Maven at every
      # SparkSession start; without this it is a fresh download per job.
      - uses: actions/cache@v4
        if: startsWith(matrix.engine, 'pyspark')
        with:
          path: |
            ~/.ivy2
            ~/.ivy2.5.2
            ~/.m2/repository
          key: ivy-spark41-iceberg111-v1

      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Run 99 queries, cold then warm
        # `shell: bash` is pipefail. Without it `... | tee` exits 0 whatever the script did, and
        # run_engine.py's "attached but completed 0 statements" guard is silently defeated.
        shell: bash
        run: python .github/scripts/run_engine.py parts 2>&1 | tee "${{ matrix.engine }}.log"

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: tpcds-${{ matrix.engine }}
          path: |
            parts/*.json
            ${{ matrix.engine }}.log
          if-no-files-found: warn

  publish:
    needs: [prepare, bench]
    # !cancelled(): an engine that failed to attach should not stop the others being published,
    # but a CANCELLED run must publish nothing -- `always()` also runs on cancellation, and a
    # half-finished matrix is not a measurement of anything.
    # (wrapped in ${{ }}: a bare leading `!` is a YAML tag indicator, not an expression.)
    if: ${{ !cancelled() && needs.prepare.result == 'success' && inputs.publish != false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      # No id-token: this job never talks to Azure.
    concurrency:
      group: tpcds-publish-${{ github.ref }}
      cancel-in-progress: false
    env:
      BENCH_RUN_STARTED_AT: ${{ needs.prepare.outputs.started }}
      BENCH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/report.txt
      - run: pip install -r requirements/report.txt

      - uses: actions/download-artifact@v6
        with:
          pattern: tpcds-*
          merge-multiple: true
          path: parts

      - name: Merge, chart, and write the table view
        run: python .github/scripts/publish.py parts

      - name: Commit results and charts
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        # A GITHUB_TOKEN push does not trigger workflows, so this cannot loop.
        #
        # ON A REJECTED PUSH, REGENERATE -- NEVER REBASE. bench.yml has the run that paid for
        # this rule. Nothing under results/ or docs/ is hand-written -- every byte is a function
        # of results/**/*.json -- so: drop this attempt, reset onto origin/main and generate
        # again. parts/ is untracked, so the artifacts survive the reset.
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git add results docs
            if git diff --cached --quiet; then
              echo "nothing to commit"
              exit 0
            fi
            git commit -m "tpcds: SF=${TPCDS_SF} results for run ${{ github.run_id }}"
            if git push; then exit 0; fi
            echo "push rejected (attempt $attempt); regenerating on top of origin/main"
            git fetch origin main
            git reset --hard FETCH_HEAD
            python .github/scripts/publish.py parts
          done
          echo "::error::could not push after 3 attempts"
          exit 1
