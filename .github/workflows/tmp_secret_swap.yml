name: TEMP gluten credential restart
# TEMPORARY: proves PysparkGlutenIceberg.refresh() restarts the JVM on a fresh SAS mid-pass and the
# remaining statements run on it. Forces the restart after Q10 at TPC-DS SF=1. Deleted after.
on:
  workflow_dispatch:
  push:
    paths: [.github/workflows/tmp_secret_swap.yml]
permissions:
  id-token: write
  contents: read
jobs:
  restart:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUNBUFFERED: "1"
      TPCDS_SF: "1"
      BENCH_SUITE: tpcds
      BENCH_ENGINE: pyspark_gluten_iceberg
      FABRIC_WORKSPACE_ID: ${{ secrets.FABRIC_WORKSPACE_ID }}
      FABRIC_LAKEHOUSE_ID: ${{ secrets.FABRIC_LAKEHOUSE_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements/pyspark_gluten_iceberg.txt
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.ivy2
            ~/.ivy2.5.2
            ~/.m2/repository
          key: ivy-spark41-iceberg111-v1
      - shell: bash
        run: |
          python - <<'PY'
          import subprocess, sys, time
          from bench.suite import suite_class
          from bench.tpch.engines import get_engine
          from bench.tpch.runner import benchmark

          cfg = suite_class().from_env()
          engine = get_engine(cfg.engine, cfg)
          calls = {"n": 0}
          execute = engine.execute

          def counting(sql):
              calls["n"] += 1
              if calls["n"] == 10:
                  # Q11's refresh will see 60s left, under the 15-minute margin.
                  engine._expires = time.time() + 60
                  jvms = subprocess.run(["pgrep", "-c", "java"], capture_output=True, text=True)
                  print("  java processes before restart:", jvms.stdout.strip())
              return execute(sql)

          engine.execute = counting
          result = benchmark(engine, cfg)
          ok = [r.query for r in result.rows if r.phase == "query" and r.status == "ok"]
          bad = [r.query for r in result.rows if r.phase == "query" and r.status != "ok"]
          print(f"ok {len(ok)}, failed {bad}, expires now in {engine._expires - time.time():.0f}s")
          after = [q for q in ok if q > 10]
          sys.exit(0 if len(after) >= 80 else 1)
          PY
