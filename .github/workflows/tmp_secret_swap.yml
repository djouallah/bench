name: TEMP duckdb secret swap
# TEMPORARY: proves DuckDB reads a replaced azure secret inside one live session. Deleted after.
on:
  workflow_dispatch:
  push:
    paths: [.github/workflows/tmp_secret_swap.yml]
permissions:
  id-token: write
  contents: read
jobs:
  swap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUNBUFFERED: "1"
      AZURE_TRANSPORT_OPTION_TYPE: curl
      CURL_CA_INFO: /etc/ssl/certs/ca-certificates.crt
      TPCDS_SF: "1"
      BENCH_SUITE: tpcds
      BENCH_ENGINE: duckdb_iceberg
      FABRIC_WORKSPACE_ID: ${{ secrets.FABRIC_WORKSPACE_ID }}
      FABRIC_LAKEHOUSE_ID: ${{ secrets.FABRIC_LAKEHOUSE_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements/duckdb_iceberg.txt
      - shell: bash
        run: |
          python - <<'PY'
          from bench import auth
          from bench.suite import suite_class
          from bench.tpch.engines import get_engine
          cfg = suite_class().from_env()
          e = get_engine("duckdb_iceberg", cfg)
          e.setup()
          def read(table):
              try:
                  return f"ok {e.execute(f'SELECT count(*) FROM {table}')}"
              except Exception as exc:
                  return f"FAIL {type(exc).__name__}: {str(exc)[:120]}"
          print("1 good token, store_sales:", read("store_sales"))
          e._storage_secret("not-a-token")
          print("2 bogus secret, catalog_sales:", read("catalog_sales"))
          e._token = "stale"
          e.refresh()
          print("3 refresh(), web_sales:", read("web_sales"))
          e.close()
          PY
